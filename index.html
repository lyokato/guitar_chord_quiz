<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギターコード・ポジションクイズ</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1e232b;
    --panel2: #262c36;
    --text: #e8ecf1;
    --sub: #9aa5b1;
    --accent: #4fc3f7;   /* キーカラー: 強調 */
    --nav: #2e4166;      /* ナビゲーション系ボタン: 補助的なやや暗めのネイビー */
    --timer: #ffb74d;    /* タイマー系: カウンタリング・一時停止/再開 */
    --root: #ef5350;
    --tone: #26a69a;
    --line: #3a424e;
    --warn: #ffb74d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 980px; padding: 24px 16px 48px; }
  .screen { display: none; }
  .screen.active { display: block; }
  h1 { font-size: 1.9rem; text-align: center; letter-spacing: .05em; }
  h2 { font-size: 1.2rem; margin-bottom: 12px; color: var(--accent); }
  button {
    font-family: inherit;
    border: none; border-radius: 10px;
    cursor: pointer;
    background: var(--panel2);
    color: var(--text);
    padding: 10px 18px;
    font-size: 1rem;
    transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: #0b0e12; font-weight: 700; }
  button.big { font-size: 1.25rem; padding: 16px 40px; letter-spacing: .08em; }
  button.ghost { background: transparent; border: 1px solid var(--line); }
  button.small { font-size: .85rem; padding: 6px 12px; border-radius: 8px; }

  /* アイコンボタン: 役割ごとに3種
     primary   = 画面進行 (答えを見る / 次へ)
     secondary = 補助操作 (音を鳴らす)
     timer     = タイマー操作 (一時停止 / 再開) — リングと同じアクセント色で揃える */
  .icon-btn {
    width: 56px; height: 56px; border-radius: 50%; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .icon-btn svg { display: block; }
  .icon-btn.primary { background: var(--accent); color: #0b0e12; }
  /* ナビゲーション(終了・次へ・戻る): 主役のコンテンツを邪魔しない控えめな色 */
  .icon-btn.nav { background: var(--nav); color: #d9e3f3; }
  .icon-btn.sm { width: 44px; height: 44px; }
  .icon-btn.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .icon-btn.timer {
    width: 64px; height: 64px; /* カウンタ(72px)よりわずかに小さく */
    background: transparent; color: var(--timer); border: 2px solid var(--timer);
  }
  .icon-btn.timer:disabled {
    color: var(--line); border-color: var(--line);
    cursor: default; filter: none; transform: none;
  }
  /* カウンタ・一時停止・再開をひとかたまりに隣接配置 */
  .timer-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .timer-row .ring-wrap { margin: 0; }

  /* ---- title ---- */
  #screen-title { text-align: center; padding-top: 12vh; }
  #screen-title .logo { font-size: 4rem; margin-bottom: 8px; }
  #screen-title .menu { display: flex; flex-direction: column; gap: 16px; align-items: center; margin-top: 48px; }
  #screen-title .menu button { width: 260px; }

  /* ---- settings ---- */
  .navbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); padding: 10px 0; margin-bottom: 10px;
  }
  .nav-title { font-size: 1.3rem; font-weight: 700; letter-spacing: .08em; }
  .panel { background: var(--panel); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
  .row label { color: var(--text); }
  input[type="number"] {
    width: 80px; padding: 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2);
    color: var(--text); font-size: 1rem; text-align: center;
  }
  input[type="checkbox"], input[type="radio"] { transform: scale(1.15); accent-color: var(--accent); margin-right: 2px; }
  .filter-group {
    background: rgba(255,255,255,.03);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 12px;
  }
  .chk-group { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 10px; }
  .chk-group label {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel2); padding: 7px 12px; border-radius: 8px;
    cursor: pointer; user-select: none; font-size: .9rem;
    border: 1px solid transparent; white-space: nowrap;
  }
  .chk-group label:has(input:checked) { border-color: rgba(154, 165, 177, .45); }
  .chk-group label .sym {
    color: #fff; font-weight: 700; font-family: Menlo, Consolas, monospace; font-size: .95em;
  }
  .chk-group label .sub { color: var(--sub); font-size: .76em; }
  /* コードタイプ二段リスト */
  .qual-block { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .qual-block:last-child { border-bottom: none; padding-bottom: 2px; }
  .qual-parent {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none; width: fit-content;
  }
  .qual-parent .sym { color: #fff; font-weight: 700; font-family: Menlo, Consolas, monospace; }
  .qual-parent .sub { color: var(--sub); font-size: .8rem; }
  .qual-children { margin: 10px 0 0 26px; }
  .preset-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .preset-btns button { border: 1px solid var(--line); background: var(--panel2); font-weight: 700; }
  .roots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
  .roots-grid label { justify-content: center; }
  .group-head { display: flex; align-items: center; gap: 10px; }
  .group-head .name { font-weight: 700; color: var(--text); }
  .group-head .head-btns, .sub-head .head-btns { margin-left: auto; display: flex; gap: 6px; }
  .sub-head {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px; color: var(--sub); font-size: .85rem; font-weight: 700;
  }
  .divider { border-top: 1px solid var(--line); margin: 14px 0 2px; }
  .note { color: var(--sub); font-size: .8rem; margin-top: 8px; line-height: 1.6; }
  .count-badge { color: var(--warn); font-weight: 700; font-size: 1.2rem; }

  #question-list {
    display: none; margin-top: 12px; max-height: 340px; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px 12px;
    background: rgba(0,0,0,.15);
  }
  #question-list.open { display: block; }
  .q-group { margin-top: 12px; }
  .q-group-title {
    font-size: .82rem; font-weight: 700; color: var(--accent);
    border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 8px;
    letter-spacing: .04em;
  }
  .q-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .q-chip {
    background: var(--panel2); border-radius: 7px; padding: 5px 9px;
    font-size: .85rem; cursor: pointer; border: 1px solid transparent;
    font-family: Menlo, Consolas, monospace; min-width: 52px; text-align: center;
  }
  .q-chip:hover { border-color: var(--accent); }
  #preview-box { margin-top: 14px; background: var(--panel2); border-radius: 10px; padding: 14px; display: none; }
  #preview-box.open { display: block; }
  #preview-title { font-weight: 700; margin-bottom: 8px; }

  .toolbar { display: flex; gap: 12px; margin-top: 8px; }

  /* ---- game ---- */
  #game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  #game-header .icon-btn { width: 60px; height: 60px; } /* 進行ボタン(.next-btn)と同サイズ */
  #game-qno { color: var(--sub); }
  .q-card {
    background: var(--panel); border-radius: 16px;
    padding: 30px 20px; text-align: center; margin-bottom: 20px;
  }
  .q-line1 { font-size: 1.25rem; color: #fff; letter-spacing: .06em; }
  .q-chord { font-size: 4.2rem; font-weight: 800; margin-top: 4px; color: var(--accent); }

  #countdown-area { text-align: center; padding: 10px 0 20px; }
  /* カウンタは問題画面・回答画面で同一サイズ */
  .ring-wrap { position: relative; width: 72px; height: 72px; margin: 0 auto; }
  .ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-bg { stroke: var(--panel2); }
  .ring-fg { stroke: var(--timer); transition: stroke-dashoffset .1s linear; }
  #countdown-num, #next-countdown-num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1.7rem; font-weight: 800;
  }
  #answer-area { display: none; }
  #fretboard-wrap { background: var(--panel); border-radius: 16px; padding: 16px 10px 12px; position: relative; }
  /* 音を鳴らすボタン: 音は指板上のポジションに対応するため、指板ブロック右上にフローティング配置 */
  .icon-btn.secondary.float-play {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    width: 48px; height: 48px;
    background: var(--tone); color: #fff; border: none;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .45);
  }
  /* コントロール行: タイマー群は中央、進行ボタンはコンテンツ幅の右端に同一ライン配置 */
  .control-line {
    position: relative; margin-top: 16px; min-height: 72px;
    display: flex; align-items: center; justify-content: center;
  }
  .control-line .ring-wrap { margin: 0; }
  .next-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 60px; height: 60px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
  }
  .next-btn:active { transform: translateY(-50%) scale(.97); }
  .board-outer { position: relative; }
  .board-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .board-scroll svg { width: 100%; min-width: 640px; height: auto; display: block; }
  /* トリムされていることを示す両端のフェード */
  .edge-fade {
    position: absolute; top: 0; bottom: 0; width: 34px;
    pointer-events: none; opacity: 0; transition: opacity .25s;
    display: flex; align-items: center; color: #aeb8c4; font-size: 22px;
  }
  .edge-fade.left  { left: 0;  background: linear-gradient(to right, rgba(20,23,28,.95), rgba(20,23,28,0)); justify-content: flex-start; }
  .edge-fade.right { right: 0; background: linear-gradient(to left,  rgba(20,23,28,.95), rgba(20,23,28,0)); justify-content: flex-end; }
  .edge-fade.visible { opacity: 1; }


  /* ---- スマホ縦持ち ---- */
  @media (max-width: 600px) {
    .app { padding: 16px 10px 40px; }
    h1 { font-size: 1.4rem; }
    #screen-title { padding-top: 6vh; }
    #screen-title .logo { font-size: 3rem; }
    .q-line1 { font-size: .95rem; }
    .q-chord { font-size: 2.8rem; }
    .q-card { padding: 14px 12px; }
    .panel { padding: 14px 12px; }
    .filter-group { padding: 10px; }
    .chk-group label { padding: 6px 9px; font-size: .82rem; }
    .roots-grid { grid-template-columns: repeat(4, 1fr); }
    .group-head { flex-wrap: wrap; }
    button.big { width: 100%; max-width: 320px; }
  }

  /* ---- スマホ横持ち (高さが低い画面) ---- */
  @media (max-height: 520px) and (orientation: landscape) {
    .app { padding: 10px 16px 24px; }
    #screen-title { padding-top: 2vh; }
    #screen-title .logo { font-size: 2rem; margin-bottom: 0; }
    #screen-title .menu { flex-direction: row; justify-content: center; margin-top: 24px; }
    #screen-title .menu button { width: auto; min-width: 180px; }
    #game-header { margin-bottom: 8px; }
    .q-card { padding: 8px 12px; margin-bottom: 10px; }
    .q-line1 { font-size: .9rem; }
    .q-chord { font-size: 2rem; margin-top: 2px; }
    #countdown-area { padding: 4px 0 8px; }
    .ring-wrap { width: 56px; height: 56px; }
    .icon-btn.timer { width: 50px; height: 50px; }
    #countdown-num, #next-countdown-num { font-size: 1.3rem; }
    .control-line { margin-top: 8px; min-height: 56px; }
    .next-btn, #game-header .icon-btn { width: 52px; height: 52px; }
    #fretboard-wrap { padding: 8px 8px 8px; }
    #next-wrap { margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ==== タイトル ==== -->
  <div id="screen-title" class="screen active">
    <div class="logo">🎸</div>
    <h1>コード・ポジションクイズ</h1>
    <div class="menu">
      <button class="primary big" onclick="startGame()">START</button>
      <button class="big ghost" onclick="showScreen('settings')">SETTINGS</button>
    </div>
  </div>

  <!-- ==== 設定 ==== -->
  <div id="screen-settings" class="screen">
    <div class="navbar">
      <button class="icon-btn nav sm" onclick="navBack()" aria-label="戻る" title="戻る">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="nav-title">SETTINGS</span>
    </div>

    <div class="panel">
      <h2>タイマー</h2>
      <div class="row">
        <label>問題 → 答え:</label>
        <input type="number" id="set-question-sec" min="1" max="60" value="10" inputmode="numeric" pattern="[0-9]*"> 秒
      </div>
      <div class="row">
        <label><input type="checkbox" id="set-auto-next" checked> 答えの後、自動で次の問題へ進む</label>
      </div>
      <div class="row" id="row-answer-sec">
        <label>答え → 次の問題:</label>
        <input type="number" id="set-answer-sec" min="1" max="60" value="10" inputmode="numeric" pattern="[0-9]*"> 秒
      </div>
      <p class="note">自動送りをオフにすると、答え画面に「次へ」ボタンが表示されます。</p>
    </div>

    <div class="panel">
      <h2>指板表示</h2>
      <div class="chk-group">
        <label><input type="radio" name="board-label" value="degree"> 度数</label>
        <label><input type="radio" name="board-label" value="note"> 音名</label>
      </div>
    </div>

    <div class="panel">
      <h2>レッスン用一括設定</h2>
      <div class="preset-btns" id="lesson-presets"></div>
      <p class="note">押すと、出題フィルターの内容がそのレッスン内容に切り替わります。</p>
    </div>

    <div class="panel">
      <h2>出題フィルター</h2>

      <div class="filter-group">
        <div class="group-head"><span class="name">コードタイプ</span>
          <span class="head-btns">
            <button class="small" onclick="setAllQualForms(true)">全選択</button>
            <button class="small" onclick="setAllQualForms(false)">全解除</button>
          </span>
        </div>
        <div id="grp-qualforms"></div>
      </div>

      <div class="filter-group">
        <div class="group-head"><span class="name">ローコード</span>
          <span class="head-btns">
            <button class="small" onclick="setAllLowChords(true)">全選択</button>
            <button class="small" onclick="setAllLowChords(false)">全解除</button>
          </span>
        </div>
        <div class="chk-group" id="grp-lowchords"></div>
        <p class="note">※ ローコードはルート弦・ルート音の設定に関わらず、ここで選択したものが出題されます。</p>
      </div>

      <div class="filter-group">
        <div class="group-head"><span class="name">ルート</span></div>
        <div class="sub-head"><span>弦</span></div>
        <div class="chk-group" id="grp-strings"></div>
        <div class="divider"></div>
        <div class="sub-head"><span>音</span>
          <span class="head-btns">
            <button class="small" onclick="setGroup('roots', true)">全選択</button>
            <button class="small" onclick="setGroup('roots', false)">全解除</button>
          </span>
        </div>
        <div class="chk-group roots-grid" id="grp-roots"></div>
      </div>
    </div>

    <div class="panel">
      <h2>登録済みの設問</h2>
      <p>現在の対象: <span class="count-badge" id="pool-count">0</span> 問</p>
      <div class="toolbar">
        <button class="small" onclick="toggleQuestionList()">一覧を表示 / 閉じる</button>
      </div>
      <div id="question-list"></div>
      <div id="preview-box">
        <div id="preview-title"></div>
        <div class="board-outer">
          <div id="preview-board" class="board-scroll"></div>
          <div class="edge-fade left"><span>‹</span></div>
          <div class="edge-fade right"><span>›</span></div>
        </div>
        <div class="toolbar">
          <button class="small primary" onclick="playPreview()">♪ 音を鳴らす</button>
          <button class="small" onclick="closePreview()">閉じる</button>
        </div>
      </div>
    </div>

    <div style="text-align:center; margin-top: 8px;">
      <button class="big" onclick="navBack()">タイトルへ戻る</button>
    </div>
  </div>

  <!-- ==== ゲーム ==== -->
  <div id="screen-game" class="screen">
    <div id="game-header">
      <span id="game-qno">No. 1</span>
      <button class="icon-btn nav" onclick="endGame()" aria-label="終了" title="終了">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="q-card">
      <div class="q-line1" id="q-info"></div>
      <div class="q-chord" id="q-chord"></div>
    </div>

    <!-- 問題フェーズ: カウントダウン -->
    <div id="countdown-area">
      <div class="control-line">
        <div class="ring-wrap">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle class="ring-bg" cx="70" cy="70" r="60" fill="none" stroke-width="10"/>
            <circle class="ring-fg" id="ring-fg" cx="70" cy="70" r="60" fill="none" stroke-width="10"
                    stroke-linecap="round" stroke-dasharray="376.99" stroke-dashoffset="0"/>
          </svg>
          <div id="countdown-num">5</div>
        </div>
        <button class="icon-btn nav next-btn" onclick="revealAnswer()" aria-label="答えを見る" title="答えを見る">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <!-- 答えフェーズ -->
    <div id="answer-area">
      <div id="fretboard-wrap">
        <button class="icon-btn secondary float-play" onclick="playCurrent()" aria-label="音を鳴らす" title="音を鳴らす">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 17.5V6l9-2.2v10.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><ellipse cx="6.6" cy="17.6" rx="2.7" ry="2.3" fill="currentColor"/><ellipse cx="15.6" cy="14.8" rx="2.7" ry="2.3" fill="currentColor"/></svg>
        </button>
        <div class="board-outer">
          <div id="game-board" class="board-scroll"></div>
          <div class="edge-fade left"><span>‹</span></div>
          <div class="edge-fade right"><span>›</span></div>
        </div>
      </div>
      <div class="control-line">
        <div class="timer-row" id="next-wrap">
          <div class="ring-wrap">
            <svg width="90" height="90" viewBox="0 0 90 90">
              <circle class="ring-bg" cx="45" cy="45" r="38" fill="none" stroke-width="7"/>
              <circle class="ring-fg" id="next-ring-fg" cx="45" cy="45" r="38" fill="none" stroke-width="7"
                      stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="0"/>
            </svg>
            <div id="next-countdown-num">5</div>
          </div>
          <button id="btn-pause" class="icon-btn timer" onclick="pauseTimer()" aria-label="一時停止" title="一時停止">
            <svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/></svg>
          </button>
          <button id="btn-resume" class="icon-btn timer" onclick="resumeTimer()" aria-label="再開" title="再開">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M8.5 5.2v13.6L19.5 12z" fill="currentColor"/></svg>
          </button>
        </div>
        <button class="icon-btn nav next-btn" onclick="nextQuestion()" aria-label="次へ" title="次へ">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
"use strict";

/* ================= コードデータ ================= */

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLAT_NAMES = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];

// ローコードのフラットな一覧 (設定UI・プリセット用)。label例: "C", "Am", "D7", "CM7"
const LOW_CHORD_LIST = [];
for (const qual of Object.keys(LOW_CHORDS)) {
  for (const rootKey of Object.keys(LOW_CHORDS[qual])) {
    LOW_CHORD_LIST.push({
      id: qual + "|" + rootKey, qual, rootKey,
      label: rootKey + QUALITIES[qual].suffix
    });
  }
}

// ルート音 → ルート弦上のフレット
// - 1フレットルート(6弦F, 5弦B♭)はバレーならそのまま、
//   利用弦を限定したパターンでは手型が作りにくいため1オクターブ上(13フレット)へずらす
// - 左展開(5L)は左に3フレット必要なため、足りない場合は12フレット右へずらす
function rootFret(rootPc, mode, form) {
  const stringNo = ROOT_MODES[mode].stringNo;
  const open = OPEN_STRINGS[stringNo].pc;
  let r = ((rootPc - open) % 12 + 12) % 12;
  if (r === 0 && form !== "power" && form !== "power3") r = 12; // パワーコードは開放弦ルートをそのまま使う
  if (mode === "5L") {
    if (r < 4) r += 12;
  } else if (r === 1 && !NO_SHIFT_FORMS.has(form)) {
    r = 13;
  }
  return r;
}

// 1フレットルートでもそのまま押さえられるフォーム (バレー、パワーコード)
const NO_SHIFT_FORMS = new Set(["full", "power", "power3"]);

// 問題オブジェクトからボイシングを計算
// 戻り値: { positions: [{string, fret, pc, midi, isRoot}], refPos: {string, fret} | null }
function computeVoicing(q) {
  // ローコード: 固定グリップをそのまま使う
  if (q.form === "open") {
    const shape = LOW_CHORDS[q.qual][q.rootKey];
    const positions = [];
    for (const [sStr, fret] of Object.entries(shape)) {
      const s = Number(sStr);
      const pc = (OPEN_STRINGS[s].pc + fret) % 12;
      positions.push({
        string: s, fret, pc,
        midi: OPEN_STRINGS[s].midi + fret,
        isRoot: pc === q.root
      });
    }
    return { positions, refPos: null, barre: null };
  }
  const mode = q.mode || String(q.string);
  const stringNo = ROOT_MODES[mode].stringNo;
  const R = rootFret(q.root, mode, q.form);
  const shape = SHAPES[mode][q.form][q.qual];
  const positions = [];
  for (const [sStr, off] of Object.entries(shape)) {
    const s = Number(sStr);
    const fret = R + off;
    const pc = (OPEN_STRINGS[s].pc + fret) % 12;
    positions.push({
      string: s, fret, pc,
      midi: OPEN_STRINGS[s].midi + fret,
      isRoot: pc === q.root
    });
  }
  let refPos = null;
  if (!positions.some(p => p.string === stringNo)) {
    refPos = { string: stringNo, fret: R, midi: OPEN_STRINGS[stringNo].midi + R };
  }
  // バレー(人差し指)シルエット
  let barre = null;
  if (q.form === "full") {
    if (mode === "5L") {
      barre = { fret: R - 3, fromString: 1, toString: 3 }; // Cシェイプは1〜3弦をR-3でバレー
    } else {
      barre = { fret: R, fromString: 1, toString: stringNo };
    }
  }
  return { positions, refPos, barre };
}

function chordName(q) {
  const suffix = QUALITIES[q.qual].suffix;
  const rootName = q.rootName || NOTE_NAMES[q.root];
  return rootName + (suffix ? " " + suffix : "");
}
function questionLabel(q) {
  if (q.form === "open") return "ローコード " + chordName(q);
  const mode = q.mode || String(q.string);
  return ROOT_MODES[mode].label + " " + chordName(q) + "・" + FORMS[q.form].name;
}

/* ================= 設定 ================= */

// コードタイプごとに実際に存在する構成 (SHAPESから導出。矛盾する組み合わせは生まれない)
// ローコードは専用の個別選択 (settings.lowChords) で扱うため、二段リストには含めない
function availableForms(qual) {
  return Object.keys(FORMS).filter(f =>
    Object.keys(ROOT_MODES).some(m => SHAPES[m][f] && SHAPES[m][f][qual])
  );
}

const settings = {
  questionSec: 10,
  autoNext: true,
  answerSec: 10,
  boardLabel: "degree", // 指板の丸の中: "degree"=度数(R,3,5...) / "note"=音名
  strings: { "6": true, "5": true, "5L": false }, // 左展開は応用のためデフォルトOFF
  // コードタイプ × 構成 の二段構造
  qualForms: Object.fromEntries(Object.keys(QUALITIES).map(q =>
    [q, Object.fromEntries(availableForms(q).map(f => [f, true]))]
  )),
  lowChords: Object.fromEntries(LOW_CHORD_LIST.map(c => [c.id, true])),
  roots: Object.fromEntries(ROOT_OPTIONS.map(o => [o.key, true]))
};

function saveSettings() {
  try { localStorage.setItem("chordQuizSettings", JSON.stringify(settings)); } catch (e) {}
}
function loadSettings() {
  try {
    const raw = localStorage.getItem("chordQuizSettings");
    if (!raw) return;
    const s = JSON.parse(raw);
    if (typeof s.questionSec === "number") settings.questionSec = s.questionSec;
    if (typeof s.autoNext === "boolean") settings.autoNext = s.autoNext;
    if (typeof s.answerSec === "number") settings.answerSec = s.answerSec;
    if (s.boardLabel === "degree" || s.boardLabel === "note") settings.boardLabel = s.boardLabel;
    for (const g of ["strings", "roots"]) {
      if (s[g]) for (const k of Object.keys(settings[g])) {
        if (typeof s[g][k] === "boolean") settings[g][k] = s[g][k];
      }
    }
    if (s.qualForms) {
      for (const q of Object.keys(settings.qualForms)) {
        if (!s.qualForms[q]) continue;
        for (const f of Object.keys(settings.qualForms[q])) {
          if (typeof s.qualForms[q][f] === "boolean") settings.qualForms[q][f] = s.qualForms[q][f];
        }
      }
    }
    if (s.lowChords) {
      for (const id of Object.keys(settings.lowChords)) {
        if (typeof s.lowChords[id] === "boolean") settings.lowChords[id] = s.lowChords[id];
      }
    }
  } catch (e) {}
}

function buildPool() {
  const pool = [];
  // ローコード: ルート弦・ルート音の設定に関わらず、個別選択されたものを追加
  for (const c of LOW_CHORD_LIST) {
    if (!settings.lowChords[c.id]) continue;
    const opt = ROOT_OPTIONS.find(o => o.key === c.rootKey);
    pool.push({ mode: "open", string: 0, form: "open", qual: c.qual, root: opt.pc, rootName: opt.label, rootKey: c.rootKey });
  }
  for (const mode of Object.keys(ROOT_MODES)) {
    if (!settings.strings[mode]) continue;
    for (const qual of Object.keys(settings.qualForms)) {
      for (const form of Object.keys(settings.qualForms[qual])) {
        if (!settings.qualForms[qual][form]) continue;
        // ルートの取り方によっては存在しない構成をスキップ
        if (!SHAPES[mode][form] || !SHAPES[mode][form][qual]) continue;
        for (const opt of ROOT_OPTIONS) {
          if (!settings.roots[opt.key]) continue;
          pool.push({
            mode, string: ROOT_MODES[mode].stringNo,
            form, qual, root: opt.pc, rootName: opt.label
          });
        }
      }
    }
  }
  return pool;
}

/* ---- 設定UIの構築 ---- */

function makeCheckbox(group, key, label, sym) {
  const lb = document.createElement("label");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = settings[group][key];
  cb.addEventListener("change", () => {
    settings[group][key] = cb.checked;
    saveSettings();
    refreshPoolInfo();
  });
  cb.dataset.group = group;
  cb.dataset.key = key;
  lb.appendChild(cb);
  if (sym) {
    // 記号を主体(白)に、カタカナ表記を補足(小さく弱い色)に
    const main = document.createElement("span");
    main.className = "sym";
    main.textContent = sym;
    lb.appendChild(main);
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = label;
    lb.appendChild(sub);
  } else {
    lb.appendChild(document.createTextNode(label));
  }
  return lb;
}

function buildSettingsUI() {
  const gs = document.getElementById("grp-strings");
  for (const [key, m] of Object.entries(ROOT_MODES)) {
    gs.appendChild(makeCheckbox("strings", key, m.label));
  }

  document.querySelectorAll('input[name="board-label"]').forEach(r => {
    r.checked = settings.boardLabel === r.value;
    r.addEventListener("change", () => {
      if (r.checked) { settings.boardLabel = r.value; saveSettings(); }
    });
  });

  buildLessonPresetButtons();
  buildQualFormsUI();
  buildLowChordsUI();

  const gr = document.getElementById("grp-roots");
  for (const opt of ROOT_OPTIONS) gr.appendChild(makeCheckbox("roots", opt.key, opt.label));

  const qSec = document.getElementById("set-question-sec");
  const aSec = document.getElementById("set-answer-sec");
  const auto = document.getElementById("set-auto-next");
  qSec.value = settings.questionSec;
  aSec.value = settings.answerSec;
  auto.checked = settings.autoNext;
  document.getElementById("row-answer-sec").style.opacity = settings.autoNext ? 1 : 0.4;
  aSec.disabled = !settings.autoNext;

  qSec.addEventListener("change", () => {
    settings.questionSec = clampInt(qSec.value, 1, 60, 10);
    qSec.value = settings.questionSec;
    saveSettings();
  });
  aSec.addEventListener("change", () => {
    settings.answerSec = clampInt(aSec.value, 1, 60, 10);
    aSec.value = settings.answerSec;
    saveSettings();
  });
  auto.addEventListener("change", () => {
    settings.autoNext = auto.checked;
    aSec.disabled = !auto.checked;
    document.getElementById("row-answer-sec").style.opacity = auto.checked ? 1 : 0.4;
    saveSettings();
  });

  refreshPoolInfo();
}

/* ---- レッスン用一括設定 (プリセット) ----
   追加するときはこのオブジェクトにエントリを足すだけでボタンが自動生成される。
   strings:   有効にするルートモードキーの配列 (省略時は変更しない)
   roots:     有効にするルート音キーの配列 (省略時は変更しない)
   qualForms: コードタイプ → 有効にする構成キーの配列 (記載の無いタイプ・構成は全てOFF)
   lowChords: 有効にするローコードのラベル配列 (省略時は全てOFF) */

const LESSON_PRESETS = {
  "Phase 1": {
    strings: ["6", "5"],
    roots: ["C", "D", "E", "F", "G", "A", "B"], // ♯・♭無しのみ
    qualForms: {
      p5: ["power"]
    }
  },
  "Phase 2": {
    lowChords: ["Em", "G", "C", "Am", "D7", "Dm"],
    qualForms: {}
  },
  "Phase 3": {
    strings: ["6"],
    qualForms: {
      maj:  ["full"],
      min:  ["full"],
      dom7: ["full"],
      m7:   ["full"]
    }
  },
  "Phase 4": { // Phase 3の内容を5弦ルートで
    strings: ["5"],
    qualForms: {
      maj:  ["full"],
      min:  ["full"],
      dom7: ["full"],
      m7:   ["full"]
    }
  },
  "Phase 9": {
    strings: ["6", "5"], // 左展開は含めない
    qualForms: {
      dom7: ["s2346", "s234"],
      maj7: ["s2346", "s234"],
      m7:   ["s2346", "s234"],
      m7b5: ["s2346", "s2345", "s234"]
    }
  }
};

function applyLessonPreset(name) {
  const preset = LESSON_PRESETS[name];
  if (!preset) return;
  if (preset.strings) {
    for (const mode of Object.keys(settings.strings)) {
      settings.strings[mode] = preset.strings.includes(mode);
    }
    document.querySelectorAll('input[data-group="strings"]').forEach(cb => {
      cb.checked = settings.strings[cb.dataset.key];
    });
  }
  if (preset.roots) {
    for (const key of Object.keys(settings.roots)) {
      settings.roots[key] = preset.roots.includes(key);
    }
    document.querySelectorAll('input[data-group="roots"]').forEach(cb => {
      cb.checked = settings.roots[cb.dataset.key];
    });
  }
  for (const qual of Object.keys(settings.qualForms)) {
    const enabled = (preset.qualForms && preset.qualForms[qual]) || [];
    for (const f of Object.keys(settings.qualForms[qual])) {
      settings.qualForms[qual][f] = enabled.includes(f);
    }
  }
  document.querySelectorAll("#grp-qualforms input[data-form]").forEach(cb => {
    cb.checked = settings.qualForms[cb.dataset.qual][cb.dataset.form];
  });
  for (const qual of Object.keys(settings.qualForms)) refreshQualParent(qual);
  // ローコード: 記載されたものだけON
  const lows = preset.lowChords || [];
  for (const c of LOW_CHORD_LIST) settings.lowChords[c.id] = lows.includes(c.label);
  document.querySelectorAll("#grp-lowchords input").forEach(cb => {
    cb.checked = settings.lowChords[cb.dataset.lowchord];
  });
  saveSettings();
  refreshPoolInfo();
}

function buildLessonPresetButtons() {
  const wrap = document.getElementById("lesson-presets");
  wrap.innerHTML = "";
  for (const name of Object.keys(LESSON_PRESETS)) {
    const btn = document.createElement("button");
    btn.className = "small";
    btn.textContent = name;
    btn.addEventListener("click", () => applyLessonPreset(name));
    wrap.appendChild(btn);
  }
}

/* ---- コードタイプ × 構成 の二段リスト ---- */

function buildQualFormsUI() {
  const wrap = document.getElementById("grp-qualforms");
  wrap.innerHTML = "";
  for (const qual of Object.keys(settings.qualForms)) {
    const q = QUALITIES[qual];
    const block = document.createElement("div");

    pcb.type = "checkbox";
    pcb.dataset.qual = qual;
    pcb.addEventListener("change", () => {

      block.querySelectorAll("input[data-form]").forEach(cb => { cb.checked = pcb.checked; });
      saveSettings();

      refreshQualParent(qual);
    });

    sym.className = "sym";

    parent.appendChild(sym);

    parent.appendChild(sub);

    // 子: このコードタイプに存在する構成のみ
    const children = document.createElement("div");
    children.className = "chk-group qual-children";

      const lb = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = settings.qualForms[qual][form];
      cb.dataset.qual = qual;
      cb.dataset.form = form;
      cb.addEventListener("change", () => {
        settings.qualForms[qual][form] = cb.checked;
        saveSettings();
        refreshPoolInfo();
        refreshQualParent(qual);
      });
      lb.appendChild(cb);
      lb.appendChild(document.createTextNode(FORMS[form].name));
      children.appendChild(lb);
    }
    block.appendChild(children);
    wrap.appendChild(block);
    refreshQualParent(qual);
  }
}

// 親チェックボックスの状態を子から算出 (全=checked / 一部=indeterminate)
function refreshQualParent(qual) {
  const pcb = document.querySelector('input[data-qual="' + qual + '"]:not([data-form])');
  if (!pcb) return;
  const vals = Object.values(settings.qualForms[qual]);
  const on = vals.filter(Boolean).length;
  pcb.checked = on === vals.length;
  pcb.indeterminate = on > 0 && on < vals.length;
}

function setAllQualForms(value) {
  for (const qual of Object.keys(settings.qualForms)) {
    for (const f of Object.keys(settings.qualForms[qual])) settings.qualForms[qual][f] = value;
    refreshQualParent(qual);
  }
  document.querySelectorAll("#grp-qualforms input[data-form]").forEach(cb => { cb.checked = value; });
  for (const qual of Object.keys(settings.qualForms)) refreshQualParent(qual);
  saveSettings();
  refreshPoolInfo();
}

function clampInt(v, min, max, def) {
  const n = parseInt(v, 10);
  if (isNaN(n)) return def;
  return Math.min(max, Math.max(min, n));
}

function setGroup(group, value) {
  for (const k of Object.keys(settings[group])) settings[group][k] = value;
  document.querySelectorAll('input[data-group="' + group + '"]').forEach(cb => { cb.checked = value; });
  saveSettings();
  refreshPoolInfo();
}

function refreshPoolInfo() {
  const pool = buildPool();
  document.getElementById("pool-count").textContent = pool.length;
  const list = document.getElementById("question-list");
  if (list.classList.contains("open")) renderQuestionList();
}

let previewQuestion = null;

function toggleQuestionList() {
  const list = document.getElementById("question-list");
  list.classList.toggle("open");
  if (list.classList.contains("open")) renderQuestionList();
}

function renderQuestionList() {
  const list = document.getElementById("question-list");
  list.innerHTML = "";
  const pool = buildPool();
  if (pool.length === 0) {
    list.textContent = "対象の設問がありません。フィルターを確認してください。";
    return;
  }
  // ルートの取り方 × 構成 でグループ化して見やすく
  const groups = new Map();
  for (const q of pool) {
    const key = q.mode + "|" + q.form;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(q);
  }
  for (const [key, qs] of groups) {
    const [mode, form] = key.split("|");
    const g = document.createElement("div");
    g.className = "q-group";
    const title = document.createElement("div");
    title.className = "q-group-title";
    title.textContent = (mode === "open" ? "ローコード" : ROOT_MODES[mode].label + " ─ " + FORMS[form].name) + " (" + qs.length + "問)";
    g.appendChild(title);
    const chips = document.createElement("div");
    chips.className = "q-chips";
    for (const q of qs) {
      const chip = document.createElement("div");

      chip.title = questionLabel(q);

function openPreview(q) {

/* ================= 指板グラフィック ================= */

const FB = {
  frets: 16, // 1フレットルートの13フレット移動 (最大16フレット使用) に対応
  left: 36, right: 20, top: 34, bottom: 34,
  stringGap: 30
};

// 度数表示: ルートからの半音数 → ラベル
const DEGREE_LABELS = ["R", "♭9", "9", "♭3", "3", "4", "♭5", "5", "♭6", "6", "♭7", "M7"];

function degreeLabel(q, pc) {
  const iv = (pc - q.root + 12) % 12;
  if (q.qual === "h79" && iv === 3) return "#9"; // ジミヘンコードの+3は♭3ではなく#9
  return DEGREE_LABELS[iv];
}

function renderFretboard(container, q) {
  const { positions, refPos, barre } = computeVoicing(q);
  // ♭系の呼び名で出題された場合は構成音もフラット表記にする
  const useFlat = !!(q.rootName && q.rootName.includes("♭"));
  const noteLabel = pc => settings.boardLabel === "degree"
    ? degreeLabel(q, pc)
    : (useFlat ? FLAT_NAMES[pc] : NOTE_NAMES[pc]);
  const width = 960;
  const height = FB.top + FB.stringGap * 5 + FB.bottom;
  const innerW = width - FB.left - FB.right;
  const fw = innerW / FB.frets;
  const nutX = FB.left;
  const yOf = s => FB.top + (s - 1) * FB.stringGap; // 1弦が上
  const fretCenterX = f => f === 0 ? nutX - 22 : nutX + (f - 0.5) * fw;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);

  const el = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  };

  // 指板背景
  el("rect", {
    x: nutX, y: yOf(1) - 8, width: innerW, height: FB.stringGap * 5 + 16,
    fill: "#2b241d", rx: 3
  });

  // フレット線
  for (let f = 0; f <= FB.frets; f++) {
    const x = nutX + f * fw;
    el("line", {
      x1: x, y1: yOf(1) - 8, x2: x, y2: yOf(6) + 8,
      stroke: f === 0 ? "#d8d2c5" : "#5a5248",
      "stroke-width": f === 0 ? 7 : 2.5
    });
  }

  // ポジションマーク (インレイ) — 位置認知のためやや明るめに (ただしポジションマークより控えめ)
  const inlayFill = "#6e6350";
  const midY = (yOf(3) + yOf(4)) / 2;
  for (const f of [3, 5, 7, 9, 15]) {
    el("circle", { cx: fretCenterX(f), cy: midY, r: 6.5, fill: inlayFill });
  }
  el("circle", { cx: fretCenterX(12), cy: yOf(2), r: 6.5, fill: inlayFill });
  el("circle", { cx: fretCenterX(12), cy: yOf(5), r: 6.5, fill: inlayFill });

  // 弦
  for (let s = 1; s <= 6; s++) {
    el("line", {
      x1: nutX - 4, y1: yOf(s), x2: nutX + innerW, y2: yOf(s),
      stroke: "#b8beC6", "stroke-width": 0.8 + s * 0.45
    });
  }

  // フレット番号 — 位置認知のためやや強調 (ただしポジションマークより控えめ)
  for (const f of [1, 3, 5, 7, 9, 12, 15]) {
    el("text", {
      x: fretCenterX(f), y: yOf(6) + 28, fill: "#c2cad4",
      "font-size": 15.5, "font-weight": 600, "text-anchor": "middle"
    }, f);
  }

  // 人差し指バレーのシルエット
  if (barre) {
    const bx = fretCenterX(barre.fret);
    const yTop = yOf(barre.fromString) - 15;
    const yBot = yOf(barre.toString) + 15;
    el("rect", {
      x: bx - 11, y: yTop, width: 22, height: yBot - yTop,
      rx: 11, fill: "#e0ac69", "fill-opacity": 0.45,
      stroke: "#e0ac69", "stroke-opacity": 0.7, "stroke-width": 1.5
    });
    // 指先の丸み
    el("circle", { cx: bx, cy: yTop + 11, r: 13, fill: "#e0ac69", "fill-opacity": 0.45 });
  }

  // ルート基準位置(弾かない)
  if (refPos) {
    el("circle", {
      cx: fretCenterX(refPos.fret), cy: yOf(refPos.string), r: 12,
      fill: "none", stroke: "var(--root)", "stroke-width": 2.5, "stroke-dasharray": "4 3"
    });
    el("text", {
      x: fretCenterX(refPos.fret), y: yOf(refPos.string) + 4.5, fill: "var(--root)",
      "font-size": 12, "font-weight": "bold", "text-anchor": "middle"
    }, "R");
  }

  // 押さえるポジション
  for (const p of positions) {
    el("circle", {
      cx: fretCenterX(p.fret), cy: yOf(p.string), r: 13,
      fill: p.isRoot ? "var(--root)" : "var(--tone)",
      stroke: "#0e1114", "stroke-width": 1.5
    });
    el("text", {
      x: fretCenterX(p.fret), y: yOf(p.string) + 4.5, fill: "#fff",
      "font-size": 11.5, "font-weight": "bold", "text-anchor": "middle"
    }, noteLabel(p.pc));
  }

  container.innerHTML = "";
  container.appendChild(svg);
}

/* ---- 横スクロール補助: ルート音を中央へ / トリム表示 ---- */

function updateEdgeFades(board) {
  const outer = board.closest(".board-outer");
  if (!outer) return;
  const left = outer.querySelector(".edge-fade.left");
  const right = outer.querySelector(".edge-fade.right");
  const maxScroll = board.scrollWidth - board.clientWidth;
  const scrollable = maxScroll > 4;
  left.classList.toggle("visible", scrollable && board.scrollLeft > 4);
  right.classList.toggle("visible", scrollable && board.scrollLeft < maxScroll - 4);
}

// 表示領域が足りない場合、ルート音ができるだけ中央に来るようスクロール位置を調整
function centerOnRoot(board, q) {
  requestAnimationFrame(() => {
    if (q.form === "open") { // ローコードはネック側を表示
      board.scrollLeft = 0;
      updateEdgeFades(board);
      return;
    }
    const svg = board.querySelector("svg");
    if (svg && board.scrollWidth > board.clientWidth + 4) {
      const width = 960;
      const innerW = width - FB.left - FB.right;
      const fw = innerW / FB.frets;
      const R = rootFret(q.root, q.mode || String(q.string), q.form);
      const rootX = FB.left + (R - 0.5) * fw; // viewBox座標でのルート位置
      const scale = board.scrollWidth / width;
      board.scrollLeft = rootX * scale - board.clientWidth / 2;
    }
    updateEdgeFades(board);
  });
}

/* ================= サウンド ================= */

let audioCtx = null;
let silentEl = null;

// iOS Safari対策:
// 1) AudioContextはユーザー操作内で resume する必要がある
// 2) マナー(消音)スイッチON時、Web Audioは消音される。無音の<audio>を再生して
//    オーディオセッションを再生カテゴリに切り替えると鳴るようになる (unmuteハック)
function unlockIosAudio() {
  if (!silentEl) {
    silentEl = document.createElement("audio");
    silentEl.setAttribute("playsinline", "");
    silentEl.preload = "auto";
    // ごく短い無音WAV
    silentEl.src = "data:audio/wav;base64,UklGRuwAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YcgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";
  }
  const p = silentEl.play();
  if (p && p.catch) p.catch(() => {});
}

async function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  unlockIosAudio();
  if (audioCtx.state !== "running") {
    try { await audioCtx.resume(); } catch (e) {}
  }
  return audioCtx;
}

function pluck(ctx, midi, t, gain, dur) {
  const freq = 440 * Math.pow(2, (midi - 69) / 12);
  const osc1 = ctx.createOscillator();
  osc1.type = "triangle";
  osc1.frequency.value = freq;
  const osc2 = ctx.createOscillator();
  osc2.type = "sawtooth";
  osc2.frequency.value = freq;
  const osc2gain = ctx.createGain();
  osc2gain.gain.value = 0.25;

  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(Math.min(freq * 6, 8000), t);
  filter.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.5, 300), t + dur * 0.8);
  filter.Q.value = 1;

  const env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(gain, t + 0.008);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  osc1.connect(filter);
  osc2.connect(osc2gain);
  osc2gain.connect(filter);
  filter.connect(env);
  env.connect(ctx.destination);

  osc1.start(t); osc2.start(t);
  osc1.stop(t + dur + 0.1); osc2.stop(t + dur + 0.1);
}

async function playChord(q) {
  const ctx = await getAudioCtx();
  const { positions, refPos } = computeVoicing(q);
  const t0 = ctx.currentTime + 0.05;
  if (refPos) pluck(ctx, refPos.midi, t0, 0.10, 2.2); // 基準ルートは控えめに
  const sorted = positions.slice().sort((a, b) => a.midi - b.midi);
  sorted.forEach((p, i) => pluck(ctx, p.midi, t0 + 0.055 * i, 0.22, 2.2));
}

/* ================= ゲーム進行 ================= */

const game = {
  pool: [],
  current: null,
  last: null,
  qno: 0,
  timer: null
};

/* ---- SPA風ルーティング: ブラウザバックでページを離れず画面遷移 ---- */

let appNavDepth = 0;

function switchDom(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  window.scrollTo(0, 0);
}

function showScreen(name) {
  switchDom(name);
  appNavDepth++;
  history.pushState({ screen: name, depth: appNavDepth }, "", "#" + name);
}

// 戻るボタン: 履歴があればブラウザバック相当、なければタイトルへ
function navBack() {
  if (appNavDepth > 0) history.back();
  else showScreen("title");
}

window.addEventListener("popstate", (e) => {
  appNavDepth = (e.state && typeof e.state.depth === "number") ? e.state.depth : 0;
  let name = (e.state && e.state.screen) || "title";
  if (!document.getElementById("screen-" + name)) name = "title";
  clearGameTimer();
  if (name === "game") {
    // 戻る/進むでゲーム画面に来た場合は新しい問題から再開
    if (game.pool.length > 0) {
      switchDom("game");
      nextQuestion();
    } else {
      switchDom("title");
    }
    return;
  }
  switchDom(name);
});

function startGame() {
  const pool = buildPool();
  if (pool.length === 0) {
    alert("出題対象がありません。設定画面でフィルターを確認してください。");
    return;
  }
  game.pool = pool;
  game.qno = 0;
  game.last = null;
  showScreen("game");
  nextQuestion();
}

function endGame() {
  clearGameTimer();
  navBack();
}

function clearGameTimer() {
  if (game.timer) { clearInterval(game.timer); game.timer = null; }
}

function pickQuestion() {
  const pool = game.pool;
  if (pool.length === 1) return pool[0];
  let q;
  do {
    q = pool[Math.floor(Math.random() * pool.length)];
  } while (game.last && sameQ(q, game.last));
  return q;
}
function sameQ(a, b) {
  return a.mode === b.mode && a.form === b.form && a.qual === b.qual &&
         a.root === b.root && a.rootName === b.rootName;
}

function nextQuestion() {
  clearGameTimer();
  game.current = pickQuestion();
  game.last = game.current;
  game.qno++;

  const q = game.current;
  document.getElementById("game-qno").textContent = "No. " + game.qno;
  document.getElementById("q-info").textContent = q.form === "open"
    ? "ローコード"
    : ROOT_MODES[q.mode].label + " / " + FORMS[q.form].name;
  document.getElementById("q-chord").textContent = chordName(q);

  document.getElementById("countdown-area").style.display = "block";
  document.getElementById("answer-area").style.display = "none";

  runCountdown(settings.questionSec, "ring-fg", "countdown-num", 376.99, revealAnswer);
}

function revealAnswer() {
  clearGameTimer();
  document.getElementById("countdown-area").style.display = "none";
  document.getElementById("answer-area").style.display = "block";

  const board = document.getElementById("game-board");
  renderFretboard(board, game.current);
  centerOnRoot(board, game.current);

  const nextWrap = document.getElementById("next-wrap");
  cd.paused = false;
  if (settings.autoNext) {
    nextWrap.style.display = "flex";
    runCountdown(settings.answerSec, "next-ring-fg", "next-countdown-num", 238.76, nextQuestion);
    updateTimerButtons();
  } else {
    nextWrap.style.display = "none";
  }
}

function playCurrent() {
  if (game.current) playChord(game.current);
}

const cd = { total: 0, remain: 0, ring: null, num: null, circ: 0, onDone: null, paused: false };

function runCountdown(seconds, ringId, numId, circumference, onDone) {
  clearGameTimer();
  cd.total = seconds * 1000;
  cd.remain = cd.total;
  cd.ring = document.getElementById(ringId);
  cd.num = document.getElementById(numId);
  cd.circ = circumference;
  cd.onDone = onDone;
  cd.paused = false;
  cd.num.textContent = seconds;
  cd.ring.style.strokeDashoffset = 0;
  startCdTicker();
}

function startCdTicker() {
  let last = performance.now();
  game.timer = setInterval(() => {
    const now = performance.now();
    cd.remain -= (now - last);
    last = now;
    const remain = Math.max(0, cd.remain);
    cd.num.textContent = Math.ceil(remain / 1000);
    cd.ring.style.strokeDashoffset = cd.circ * (1 - remain / cd.total);
    if (remain <= 0) {
      clearGameTimer();
      cd.onDone();
    }
  }, 100);
}

function pauseTimer() {
  if (!game.timer || cd.paused) return;
  clearGameTimer();
  cd.paused = true;
  updateTimerButtons();
}

function resumeTimer() {
  if (!cd.paused) return;
  cd.paused = false;
  startCdTicker();
  updateTimerButtons();
}

function updateTimerButtons() {
  const p = document.getElementById("btn-pause");
  const r = document.getElementById("btn-resume");
  p.disabled = cd.paused;
  r.disabled = !cd.paused;
}

/* ================= 初期化 ================= */

loadSettings();
buildSettingsUI();

// 初期履歴エントリ (リロード時のハッシュに関わらずタイトルから開始)
history.replaceState({ screen: "title", depth: 0 }, "", "#title");
switchDom("title");

for (const id of ["game-board", "preview-board"]) {
  const b = document.getElementById(id);
  b.addEventListener("scroll", () => updateEdgeFades(b), { passive: true });
}
window.addEventListener("resize", () => {
  for (const id of ["game-board", "preview-board"]) updateEdgeFades(document.getElementById(id));
});
</script>
